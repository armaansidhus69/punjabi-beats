<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjabi Beats 🎵</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body { background: #0a0a0f; color: #fff; height: 100vh; overflow: hidden; }
.app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 1fr 90px; height: 100vh; }

/* SIDEBAR */
.sidebar { grid-row: 1 / 3; background: #12121a; padding: 20px 15px; overflow-y: auto; border-right: 1px solid #1f1f2e; }
.logo { font-size: 22px; font-weight: bold; margin-bottom: 25px; color: #ffb347; }
.logo span { color: #fff; }
.nav-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 5px; color: #b0b0c0; transition: 0.2s; font-size: 14px; }
.nav-item:hover { background: #1f1f2e; color: #fff; }
.nav-item.active { background: #2a2a40; color: #ffb347; }
.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #666; margin: 20px 0 10px; padding-left: 12px; }
.mood-item, .playlist-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #b0b0c0; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }
.mood-item:hover, .playlist-item:hover { background: #1f1f2e; color: #fff; }
.mood-item.active, .playlist-item.active { background: #2a2a40; color: #ffb347; }
.del-btn { color: #666; font-size: 16px; padding: 0 5px; }
.del-btn:hover { color: #ff5555; }

/* MAIN */
.main { overflow-y: auto; padding: 25px 30px; background: linear-gradient(180deg, #1a1a28 0%, #0a0a0f 300px); }
.topbar { display: flex; gap: 12px; margin-bottom: 25px; }
.search-box { flex: 1; padding: 12px 18px; border-radius: 25px; background: #1f1f2e; border: 1px solid #2a2a40; color: #fff; font-size: 14px; outline: none; }
.search-box:focus { border-color: #ffb347; }
.btn { padding: 12px 20px; border-radius: 25px; border: none; background: #ffb347; color: #0a0a0f; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
.btn:hover { background: #ffc566; transform: scale(1.03); }
.btn.secondary { background: #2a2a40; color: #fff; }
.btn.secondary:hover { background: #3a3a55; }
h1 { font-size: 28px; margin-bottom: 8px; }
.subtitle { color: #888; margin-bottom: 25px; font-size: 14px; }

/* MOOD GRID */
.mood-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; }
.mood-card { padding: 25px 20px; border-radius: 15px; cursor: pointer; transition: 0.3s; min-height: 120px; display: flex; flex-direction: column; justify-content: flex-end; }
.mood-card:hover { transform: translateY(-5px); }
.mood-card .emoji { font-size: 32px; margin-bottom: 8px; }
.mood-card .name { font-size: 16px; font-weight: bold; }

/* SONG LIST */
.song-list { display: flex; flex-direction: column; gap: 5px; }
.song-item { display: grid; grid-template-columns: 50px 1fr 100px 120px; gap: 15px; align-items: center; padding: 10px 15px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
.song-item:hover { background: #1f1f2e; }
.song-item.active { background: #2a2a40; border-left: 3px solid #ffb347; }
.song-item img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }
.song-info { overflow: hidden; }
.song-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-artist { font-size: 12px; color: #888; margin-top: 3px; }
.song-dur { font-size: 12px; color: #888; text-align: right; }
.song-actions { display: flex; gap: 8px; justify-content: flex-end; }
.icon-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 16px; padding: 5px 8px; border-radius: 5px; transition: 0.2s; }
.icon-btn:hover { color: #ffb347; background: #2a2a40; }

/* PLAYER BAR */
.player { grid-column: 1 / 3; background: #12121a; border-top: 1px solid #1f1f2e; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; padding: 0 20px; gap: 20px; }
.now-playing { display: flex; gap: 12px; align-items: center; overflow: hidden; }
.now-playing img { width: 55px; height: 55px; border-radius: 8px; }
.np-info { overflow: hidden; }
.np-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-artist { font-size: 12px; color: #888; }
.player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.player-controls { display: flex; align-items: center; gap: 18px; }
.pc-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; transition: 0.2s; }
.pc-btn:hover { color: #ffb347; transform: scale(1.1); }
.play-main { background: #ffb347; color: #0a0a0f; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.play-main:hover { background: #ffc566; color: #0a0a0f; }
.progress-bar { width: 100%; height: 4px; background: #2a2a40; border-radius: 2px; cursor: pointer; }
.progress-fill { height: 100%; background: #ffb347; border-radius: 2px; width: 0%; }
.time-row { display: flex; justify-content: space-between; font-size: 11px; color: #666; width: 100%; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100; }
.modal-overlay.show { display: flex; }
.modal { background: #1a1a28; padding: 30px; border-radius: 15px; width: 400px; max-width: 90%; border: 1px solid #2a2a40; }
.modal h2 { margin-bottom: 20px; color: #ffb347; }
.modal input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0a0a0f; border: 1px solid #2a2a40; color: #fff; border-radius: 8px; font-size: 14px; outline: none; }
.modal input:focus { border-color: #ffb347; }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; }

/* ROOM BANNER */
.room-banner { background: linear-gradient(90deg, #ffb347, #ff6b6b); padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; display: none; justify-content: space-between; align-items: center; color: #0a0a0f; font-weight: bold; }
.room-banner.show { display: flex; }
.room-code { font-family: monospace; font-size: 18px; letter-spacing: 2px; }

.empty { text-align: center; padding: 60px 20px; color: #666; }
.empty .big { font-size: 60px; margin-bottom: 15px; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #0a0a0f; }
::-webkit-scrollbar-thumb { background: #2a2a40; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a55; }
.toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: #ffb347; color: #0a0a0f; padding: 12px 24px; border-radius: 25px; font-weight: bold; z-index: 200; opacity: 0; transition: 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (max-width: 768px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } .sidebar.mobile-open { display: block; position: fixed; inset: 0 30% 0 0; z-index: 50; } .song-item { grid-template-columns: 45px 1fr 60px; } .song-actions { grid-column: 3; } .song-dur { display: none; } }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">🎵 Punjabi<span>Beats</span></div>
    <div class="nav-item active" onclick="showView('home')">🏠 Home</div>
    <div class="nav-item" onclick="showView('search')">🔍 Search</div>
    <div class="nav-item" onclick="createRoom()">👥 Group Room</div>
    <div class="nav-item" onclick="joinRoomPrompt()">🔗 Join Room</div>
    <div class="section-title">Moods</div>
    <div id="moodList"></div>
    <div class="section-title">My Playlists</div>
    <div id="playlistList"></div>
    <div class="nav-item" onclick="openCreatePlaylist()" style="color:#ffb347">➕ New Playlist</div>
  </aside>

  <main class="main" id="main">
    <div class="room-banner" id="roomBanner">
      <span>👥 Group Room: <span class="room-code" id="roomCode">------</span></span>
      <button class="btn secondary" onclick="leaveRoom()">Leave</button>
    </div>
    <div class="topbar">
      <input class="search-box" id="searchInput" placeholder="🔍 Punjabi songs, artists search karo..." onkeypress="if(event.key==='Enter') doSearch()">
      <button class="btn" onclick="doSearch()">Search</button>
    </div>
    <div id="view"></div>
  </main>

  <footer class="player">
    <div class="now-playing">
      <img id="npCover" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='55' height='55'><rect fill='%232a2a40' width='55' height='55'/><text x='50%25' y='50%25' text-anchor='middle' dy='.3em' fill='%23666' font-size='20'>♪</text></svg>" alt="">
      <div class="np-info">
        <div class="np-title" id="npTitle">Koi song select karo</div>
        <div class="np-artist" id="npArtist">Punjabi Beats</div>
      </div>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button class="pc-btn" onclick="playPrev()">⏮</button>
        <button class="pc-btn play-main" onclick="togglePlay()" id="playBtn">▶</button>
        <button class="pc-btn" onclick="playNext()">⏭</button>
      </div>
      <div class="progress-bar" onclick="seek(event)" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="curTime">0:00</span>
        <span id="totTime">0:00</span>
      </div>
    </div>
    <div style="text-align:right; color:#666; font-size:12px">
      <span id="roomIndicator"></span>
    </div>
  </footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">New Playlist</h2>
    <input type="text" id="modalInput" placeholder="Playlist ka naam likho...">
    <div class="modal-btns">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" id="modalConfirm">Create</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addModalOverlay">
  <div class="modal">
    <h2>Playlist mein add karo</h2>
    <div id="playlistChoices" style="max-height:300px; overflow-y:auto; margin-bottom:15px"></div>
    <div class="modal-btns">
      <button class="btn secondary" onclick="closeAddModal()">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" crossorigin="anonymous"></audio>
<script type="module">
  // @apinator/client sirf ESM build ship karta hai (koi global .min.js build nahi hai),
  // isliye import karke window.Apinator global set kar rahe hain
  import { Apinator } from 'https://cdn.jsdelivr.net/npm/@apinator/client@2.0.0/dist/index.mjs';
  window.Apinator = Apinator;
</script>
<script>
// ============ CONFIG ============
const API_BASE = 'https://jiosaavn-api-sumitkolhe.vercel.app'; // Free public instance

// ============ MOODS ============
const MOODS = [
  { id: 'romantic', name: 'Romantic', emoji: '💕', color: '#ff6b9d', query: 'punjabi romantic' },
  { id: 'sad', name: 'Sad', emoji: '💔', color: '#5a6acf', query: 'punjabi sad' },
  { id: 'bhangra', name: 'Bhangra', emoji: '🕺', color: '#ff9500', query: 'bhangra' },
  { id: 'party', name: 'Party', emoji: '🎉', color: '#ff3b6b', query: 'punjabi party' },
  { id: 'folk', name: 'Folk', emoji: '🚜', color: '#7cb342', query: 'punjabi folk' },
  { id: 'sufi', name: 'Sufi', emoji: '🌙', color: '#8e44ad', query: 'sufi punjabi' },
  { id: 'old', name: 'Old Is Gold', emoji: '🎤', color: '#c9a227', query: 'old punjabi hits' },
  { id: 'trending', name: 'Trending', emoji: '🔥', color: '#e74c3c', query: 'punjabi top hits' },
];

// ============ STATE ============
let state = {
  songs: [], currentSong: null, queue: [], queueIndex: -1,
  playlists: JSON.parse(localStorage.getItem('pb_playlists') || '{}'),
  currentView: 'home', currentMood: null, currentPlaylist: null,
  isPlaying: false, roomCode: null, isHost: false,
};

// ============ INIT ============
window.addEventListener('DOMContentLoaded', () => {
  renderMoods(); renderPlaylists(); loadHome();
});

// ============ API: JioSaavn (Free, No Key!) ============
async function fetchSongs(query) {
  try {
    const res = await fetch(`${API_BASE}/search/songs?query=${encodeURIComponent(query)}&limit=30`);
    const data = await res.json();
    const results = data.data?.results || data.results || [];
    return results.map(r => ({
      id: r.id,
      title: r.name || r.title,
      artist: (r.artists?.primary?.map(a => a.name).join(', ')) || r.primaryArtists || 'Unknown',
      album: r.album?.name || '',
      cover: (r.image && (r.image.find(i => i.quality === '500x500')?.url || r.image[0]?.url)) || '',
      preview: (r.downloadUrl && (r.downloadUrl.find(d => d.quality === '320kbps')?.url || r.downloadUrl[0]?.url)) || '',
      duration: (r.duration || 30) * 1000,
    })).filter(s => s.preview);
  } catch (e) {
    console.error('JioSaavn error:', e);
    return fetchSongsFallback(query);
  }
}

// Fallback: iTunes (bilkul reliable)
async function fetchSongsFallback(query) {
  try {
    const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=30`);
    const data = await res.json();
    return data.results.filter(r => r.previewUrl).map(r => ({
      id: r.trackId, title: r.trackName, artist: r.artistName,
      album: r.collectionName,
      cover: r.artworkUrl100?.replace('100x100', '300x300') || '',
      preview: r.previewUrl, duration: r.trackTimeMillis || 30000,
    }));
  } catch (e) { return []; }
}

// ============ VIEWS ============
function showView(view, opts = {}) {
  state.currentView = view;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (view === 'home') loadHome();
  else if (view === 'search') loadSearch();
  else if (view === 'mood') loadMood(opts.mood);
  else if (view === 'playlist') loadPlaylist(opts.playlist);
}

async function loadHome() {
  document.getElementById('view').innerHTML = `
    <h1>Punjabi Beats 🎵</h1>
    <p class="subtitle">Mood chuno ya search karo — apni pasand ka music bajao</p>
    <h2 style="font-size:18px; margin-bottom:15px">Mood Playlists</h2>
    <div class="mood-grid" id="homeMoodGrid"></div>
    <h2 style="font-size:18px; margin:25px 0 15px">Trending Punjabi Songs</h2>
    <div class="song-list" id="homeSongs"><div class="empty"><div class="big">⏳</div>Loading...</div></div>
  `;
  const grid = document.getElementById('homeMoodGrid');
  MOODS.forEach(m => {
    const card = document.createElement('div');
    card.className = 'mood-card';
    card.style.background = `linear-gradient(135deg, ${m.color}, ${m.color}88)`;
    card.innerHTML = `<div class="emoji">${m.emoji}</div><div class="name">${m.name}</div>`;
    card.onclick = () => loadMood(m);
    grid.appendChild(card);
  });
  const songs = await fetchSongs('punjabi top hits');
  state.songs = songs;
  renderSongList('homeSongs', songs);
}

async function loadSearch() {
  document.getElementById('view').innerHTML = `
    <h1>Search 🔍</h1>
    <p class="subtitle">Koi bhi Punjabi song, artist ya album dhoondo</p>
    <div class="song-list" id="searchSongs">
      <div class="empty"><div class="big">🎤</div>Upar search bar mein kuch type karo</div>
    </div>
  `;
  if (state.songs.length) renderSongList('searchSongs', state.songs);
}

async function loadMood(mood) {
  state.currentMood = mood; state.currentPlaylist = null;
  document.querySelectorAll('.mood-item').forEach(n => n.classList.remove('active'));
  const el = document.querySelector(`.mood-item[data-mood="${mood.id}"]`);
  if (el) el.classList.add('active');
  document.getElementById('view').innerHTML = `
    <h1>${mood.emoji} ${mood.name}</h1>
    <p class="subtitle">${mood.name} Punjabi songs</p>
    <div class="song-list" id="moodSongs"><div class="empty"><div class="big">⏳</div>Loading...</div></div>
  `;
  const songs = await fetchSongs(mood.query);
  state.songs = songs; state.queue = songs;
  renderSongList('moodSongs', songs);
}

function loadPlaylist(name) {
  state.currentPlaylist = name; state.currentMood = null;
  document.querySelectorAll('.playlist-item').forEach(n => n.classList.remove('active'));
  const el = document.querySelector(`.playlist-item[data-pl="${name}"]`);
  if (el) el.classList.add('active');
  const songs = state.playlists[name] || [];
  state.songs = songs; state.queue = songs;
  document.getElementById('view').innerHTML = `
    <h1>📋 ${name}</h1>
    <p class="subtitle">${songs.length} songs</p>
    <div class="song-list" id="playlistSongs"></div>
  `;
  if (songs.length === 0) {
    document.getElementById('playlistSongs').innerHTML = `<div class="empty"><div class="big">🎵</div>Playlist khaali hai — songs add karo</div>`;
  } else renderSongList('playlistSongs', songs);
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  showView('search');
  const songs = await fetchSongs(q);
  state.songs = songs; state.queue = songs;
  renderSongList('searchSongs', songs);
  if (!songs.length) document.getElementById('searchSongs').innerHTML = `<div class="empty"><div class="big">😕</div>Kuch nahi mila</div>`;
}

// ============ RENDER ============
function renderSongList(containerId, songs) {
  const c = document.getElementById(containerId);
  if (!c) return;
  c.innerHTML = '';
  if (!songs.length) { c.innerHTML = `<div class="empty"><div class="big">🎵</div>Koi song nahi mila</div>`; return; }
  songs.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'song-item';
    if (state.currentSong && state.currentSong.id === s.id) div.classList.add('active');
    div.innerHTML = `
      <img src="${s.cover}" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2245%22 height=%2245%22><rect fill=%22%232a2a40%22 width=%2245%22 height=%2245%22/><text x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-size=%2216%22>♪</text></svg>'">
      <div class="song-info">
        <div class="song-title">${escapeHtml(s.title)}</div>
        <div class="song-artist">${escapeHtml(s.artist)}</div>
      </div>
      <div class="song-dur">${fmtTime(s.duration)}</div>
      <div class="song-actions">
        <button class="icon-btn" title="Add to playlist" onclick="event.stopPropagation(); openAddModal(${i})">➕</button>
      </div>
    `;
    div.onclick = () => playSong(i, songs);
    c.appendChild(div);
  });
}

function renderMoods() {
  const c = document.getElementById('moodList'); c.innerHTML = '';
  MOODS.forEach(m => {
    const div = document.createElement('div');
    div.className = 'mood-item'; div.dataset.mood = m.id;
    div.innerHTML = `<span>${m.emoji} ${m.name}</span>`;
    div.onclick = () => loadMood(m);
    c.appendChild(div);
  });
}

function renderPlaylists() {
  const c = document.getElementById('playlistList'); c.innerHTML = '';
  const names = Object.keys(state.playlists);
  if (!names.length) { c.innerHTML = `<div style="padding:8px 12px; font-size:12px; color:#555">Koi playlist nahi</div>`; return; }
  names.forEach(name => {
    const div = document.createElement('div');
    div.className = 'playlist-item'; div.dataset.pl = name;
    div.innerHTML = `<span>📋 ${escapeHtml(name)}</span><span class="del-btn" onclick="event.stopPropagation(); deletePlaylist('${escapeAttr(name)}')">×</span>`;
    div.onclick = () => loadPlaylist(name);
    c.appendChild(div);
  });
}

// ============ PLAYER ============
const audio = document.getElementById('audio');

function playSong(index, list) {
  if (!list) list = state.songs;
  state.queue = list; state.queueIndex = index;
  const song = list[index]; state.currentSong = song;
  audio.src = song.preview;
  audio.play().then(() => { state.isPlaying = true; updatePlayBtn(); }).catch(e => console.log('Play error', e));
  document.getElementById('npTitle').textContent = song.title;
  document.getElementById('npArtist').textContent = song.artist;
  document.getElementById('npCover').src = song.cover;
  document.getElementById('totTime').textContent = fmtTime(song.duration);
  if (state.currentView === 'mood') renderSongList('moodSongs', list);
  else if (state.currentView === 'search') renderSongList('searchSongs', list);
  else if (state.currentView === 'playlist') renderSongList('playlistSongs', list);
  else if (state.currentView === 'home') renderSongList('homeSongs', list);
  if (state.roomCode) broadcast({ type: 'song', song, index });
}

function togglePlay() {
  if (!state.currentSong) { if (state.songs.length) playSong(0); return; }
  if (audio.paused) {
    audio.play(); state.isPlaying = true;
    if (state.roomCode) broadcast({ type: 'play', position: audio.currentTime });
  } else {
    audio.pause(); state.isPlaying = false;
    if (state.roomCode) broadcast({ type: 'pause', position: audio.currentTime });
  }
  updatePlayBtn();
}

function updatePlayBtn() { document.getElementById('playBtn').textContent = state.isPlaying ? '⏸' : '▶'; }
function playNext() { if (state.queueIndex < state.queue.length - 1) playSong(state.queueIndex + 1, state.queue); }
function playPrev() { if (state.queueIndex > 0) playSong(state.queueIndex - 1, state.queue); }

function seek(e) {
  const bar = document.getElementById('progressBar');
  const rect = bar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if (audio.duration) { audio.currentTime = pct * audio.duration; if (state.roomCode) broadcast({ type: 'seek', position: audio.currentTime }); }
}

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    document.getElementById('progressFill').style.width = (audio.currentTime / audio.duration * 100) + '%';
    document.getElementById('curTime').textContent = fmtTime(audio.currentTime * 1000);
  }
});
audio.addEventListener('ended', () => { state.isPlaying = false; updatePlayBtn(); playNext(); });
audio.addEventListener('play', () => { state.isPlaying = true; updatePlayBtn(); });
audio.addEventListener('pause', () => { state.isPlaying = false; updatePlayBtn(); });

// ============ PLAYLISTS ============
function openCreatePlaylist() {
  document.getElementById('modalTitle').textContent = 'New Playlist';
  document.getElementById('modalInput').value = '';
  document.getElementById('modalConfirm').onclick = () => {
    const name = document.getElementById('modalInput').value.trim();
    if (!name) return;
    if (!state.playlists[name]) state.playlists[name] = [];
    savePlaylists(); renderPlaylists(); closeModal(); toast('Playlist ban gayi: ' + name);
  };
  document.getElementById('modalOverlay').classList.add('show');
}

function deletePlaylist(name) {
  if (!confirm(`"${name}" delete karni hai?`)) return;
  delete state.playlists[name]; savePlaylists(); renderPlaylists();
  if (state.currentPlaylist === name) showView('home');
  toast('Playlist delete ho gayi');
}

function savePlaylists() { localStorage.setItem('pb_playlists', JSON.stringify(state.playlists)); }

let addSongIndex = null;
function openAddModal(index) {
  addSongIndex = index;
  const c = document.getElementById('playlistChoices');
  const names = Object.keys(state.playlists);
  c.innerHTML = '';
  if (!names.length) c.innerHTML = `<div style="color:#888; text-align:center; padding:20px">Pehle ek playlist banao</div>`;
  else names.forEach(name => {
    const div = document.createElement('div');
    div.className = 'nav-item'; div.style.background = '#0a0a0f'; div.style.marginBottom = '6px';
    div.textContent = '📋 ' + name;
    div.onclick = () => {
      const song = state.songs[addSongIndex];
      if (!state.playlists[name].find(s => s.id === song.id)) { state.playlists[name].push(song); savePlaylists(); toast('Added to ' + name); }
      else toast('Already in playlist');
      closeAddModal();
    };
    c.appendChild(div);
  });
  document.getElementById('addModalOverlay').classList.add('show');
}

function closeAddModal() { document.getElementById('addModalOverlay').classList.remove('show'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

// ============ GROUP ROOM (Apinator — Real Long Distance) ============
const APINATOR_APP_KEY = 'YAHAN_APNI_APP_KEY_DAALO'; // Step 1 se copy karo
const APINATOR_CLUSTER = 'eu'; // ya 'us'

let apinatorClient = null;
let apinatorChannel = null;

function createRoom() {
  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  joinRoom(code, true);
}

function joinRoom(code, isHost = false) {
  state.roomCode = code;
  state.isHost = isHost;

  try {
    // Apinator client initialize karo
    apinatorClient = new Apinator({
      appKey: APINATOR_APP_KEY,
      cluster: APINATOR_CLUSTER,
    });

    apinatorClient.connect();

    // Channel subscribe karo — room code hi channel name hai
    apinatorChannel = apinatorClient.subscribe('room-' + code);

    // Events suno
    apinatorChannel.bind('song-change', (data) => {
      // SDK data ko khud parse kar sakta hai — string ho toh parse karo, warna as-is use karo
      const msg = typeof data === 'string' ? JSON.parse(data) : data;
      if (!state.currentSong || state.currentSong.id !== msg.song.id) {
        state.currentSong = msg.song;
        audio.src = msg.song.preview;
        audio.play().catch(() => {});
        document.getElementById('npTitle').textContent = msg.song.title;
        document.getElementById('npArtist').textContent = msg.song.artist;
        document.getElementById('npCover').src = msg.song.cover;
        document.getElementById('totTime').textContent = fmtTime(msg.song.duration);
        if (state.currentView === 'mood') renderSongList('moodSongs', state.songs);
        else if (state.currentView === 'search') renderSongList('searchSongs', state.songs);
        else if (state.currentView === 'playlist') renderSongList('playlistSongs', state.songs);
        else if (state.currentView === 'home') renderSongList('homeSongs', state.songs);
      }
    });

    apinatorChannel.bind('playback-control', (data) => {
      const msg = typeof data === 'string' ? JSON.parse(data) : data;
      if (msg.action === 'play') {
        audio.play();
        if (msg.position != null) audio.currentTime = msg.position;
      } else if (msg.action === 'pause') {
        audio.pause();
        if (msg.position != null) audio.currentTime = msg.position;
      } else if (msg.action === 'seek') {
        audio.currentTime = msg.position;
      }
    });

    // UI update karo
    document.getElementById('roomBanner').classList.add('show');
    document.getElementById('roomCode').textContent = code;
    document.getElementById('roomIndicator').textContent =
      (isHost ? '👑 Host' : '👤 Joined') + ' · ' + code;
    toast(isHost ? 'Room banaya: ' + code : 'Room join kiya: ' + code);

  } catch (e) {
    console.error('Apinator error:', e);
    toast('Group room connect nahi hua. Internet check karo.');
  }
}

function joinRoomPrompt() {
  const code = prompt('Room code daalo:');
  if (code) joinRoom(code.toUpperCase(), false);
}

function leaveRoom() {
  if (apinatorClient) {
    apinatorClient.disconnect();
    apinatorClient = null;
    apinatorChannel = null;
  }
  state.roomCode = null;
  state.isHost = false;
  document.getElementById('roomBanner').classList.remove('show');
  document.getElementById('roomIndicator').textContent = '';
  toast('Room se nikal gaye');
}

// ⚠️ Ab broadcast() server ko call karega, Apinator ko nahi
async function broadcast(msg) {
  if (!state.roomCode) return;

  try {
    // Apne serverless function ko call karo
    await fetch('/api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        channel: 'room-' + state.roomCode,
        event: msg.type === 'song' ? 'song-change' : 'playback-control',
        data: JSON.stringify(msg),
      }),
    });
  } catch (e) {
    console.error('Broadcast failed:', e);
  }
}   

// ============ HELPERS ============
function fmtTime(ms) { if (!ms || isNaN(ms)) return '0:00'; const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight' && e.shiftKey) playNext();
  if (e.code === 'ArrowLeft' && e.shiftKey) playPrev();
});


</script>
